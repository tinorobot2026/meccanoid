<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Meccanoid – comando dal telefono</title>
<style>
  :root{
    --bg:#0f1511; --panel:#17201a; --panel2:#1e2a22;
    --green:#36d07a; --green2:#2aa561; --txt:#e7f0ea; --dim:#8aa295;
    --line:#2a3a30; --blue:#4aa3ff; --red:#ff5b5b; --yellow:#ffd23f;
    --violet:#b377ff; --white:#f4f4f4; --cyan:#45d6d6;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,Roboto,sans-serif;font-size:17px}
  header{position:sticky;top:0;background:#12352a;padding:12px 14px;
    display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);z-index:5}
  header h1{font-size:18px;margin:0;flex:1;font-weight:700}
  .dot{width:12px;height:12px;border-radius:50%;background:#c0392b;box-shadow:0 0 6px #c0392b}
  .dot.on{background:var(--green);box-shadow:0 0 8px var(--green)}
  main{padding:14px;max-width:560px;margin:0 auto}
  button{font-size:17px;font-weight:600;color:var(--txt);background:var(--panel2);
    border:1px solid var(--line);border-radius:12px;padding:14px 10px;cursor:pointer}
  button:active{transform:scale(.97)}
  .big{width:100%;padding:16px;border-radius:14px;margin-bottom:10px;font-size:18px}
  .connect{background:var(--green);color:#06130c;border:none}
  .mic{background:#2b1f3a;border:1px solid #5a3f8a;font-size:19px}
  .mic.live{background:#5a3f8a;border-color:#b377ff}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:4px 0 14px}
  .grid2{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 14px}
  .sec{color:var(--dim);font-size:13px;text-transform:uppercase;letter-spacing:.5px;margin:6px 2px}
  .col{height:46px;border-radius:10px;border:2px solid #0006}
  .row{display:flex;gap:9px;margin-bottom:12px}
  input{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--txt);
    border-radius:12px;padding:14px;font-size:17px}
  .send{background:var(--green);color:#06130c;border:none;padding:0 20px;border-radius:12px;font-size:20px}
  #log{background:#0a0f0c;border:1px solid var(--line);border-radius:12px;padding:10px;
    height:190px;overflow:auto;font-family:ui-monospace,Menlo,monospace;font-size:13px;
    line-height:1.5;white-space:pre-wrap;word-break:break-word}
  .hint{color:var(--dim);font-size:13px;line-height:1.5;margin-top:12px}
  .warn{background:#3a2a12;border:1px solid #6b4d1e;color:#ffd79a;padding:12px;
    border-radius:12px;font-size:14px;margin-bottom:12px;display:none}
</style>
</head>
<body>
<header>
  <span class="dot" id="dot"></span>
  <h1>Meccanoid</h1>
</header>
<main>
  <div class="warn" id="warn"></div>
  <button class="big connect" id="btnConn">🔌 Connetti al robot</button>
  <button class="big mic" id="btnMic">🎤 Parla al robot</button>

  <div class="sec">Movimenti</div>
  <div class="grid">
    <button data-cmd="saluta">👋 Saluta</button>
    <button data-cmd="su">⬆️ Braccia su</button>
    <button data-cmd="giu">⬇️ Braccia giù</button>
    <button data-cmd="dx su">Dx su</button>
    <button data-cmd="dx giu">Dx giù</button>
    <button data-cmd="dx saluta">Dx saluta</button>
    <button data-cmd="sx su">Sx su</button>
    <button data-cmd="sx giu">Sx giù</button>
    <button data-cmd="sx saluta">Sx saluta</button>
    <button data-cmd="centro">🎯 Centro</button>
    <button data-cmd="ballo">💃 Ballo</button>
    <button data-cmd="cambia occhi">👀 Occhi</button>
  </div>

  <div class="sec">Colore spalle</div>
  <div class="grid2">
    <button class="col" style="background:var(--red)"    data-cmd="colore rosso"></button>
    <button class="col" style="background:var(--green)"  data-cmd="colore verde"></button>
    <button class="col" style="background:var(--blue)"   data-cmd="colore blu"></button>
    <button class="col" style="background:var(--yellow)" data-cmd="colore giallo"></button>
    <button class="col" style="background:var(--violet)" data-cmd="colore viola"></button>
    <button class="col" style="background:var(--cyan)"   data-cmd="colore azzurro"></button>
    <button class="col" style="background:var(--white)"  data-cmd="colore bianco"></button>
    <button class="col" style="background:#333;color:#999;font-size:12px" data-cmd="colore spento">off</button>
  </div>

  <div class="sec">Scrivi un comando o una frase</div>
  <div class="row">
    <input id="txt" placeholder='es. "alza il braccio destro"' autocomplete="off">
    <button class="send" id="btnSend">➤</button>
  </div>

  <div class="sec">Diagnostica</div>
  <div class="row">
    <button data-cmd="stato" style="flex:1">Stato</button>
    <button data-cmd="diag" style="flex:1">Diag</button>
  </div>

  <div id="log"></div>
  <div class="hint">
    Accendi prima il robot (le braccia e la testa vanno a pile), poi collega il cavo e premi <b>Connetti</b>.
    Col microfono puoi dire frasi come «alza il braccio destro», «abbassa le braccia», «balla», «cambia occhi».
  </div>
</main>

<script>
// ---------- utilità ----------
const $=s=>document.querySelector(s);
const logEl=$('#log'), dot=$('#dot'), warn=$('#warn');
function log(s){const d=document.createElement('div');d.textContent=s;logEl.appendChild(d);logEl.scrollTop=logEl.scrollHeight;}
function stato(on){dot.classList.toggle('on',on);$('#btnConn').textContent=on?'✅ Connesso':'🔌 Connetti al robot';}

if(!('usb' in navigator)){
  warn.style.display='block';
  warn.innerHTML='Questo telefono/pagina non espone il WebUSB. Apri questa pagina in <b>Chrome su Android</b> tramite il suo indirizzo <b>https</b> (GitHub Pages), non dentro un\'altra app.';
}

// ---------- WebUSB (driver CDC, con rilevamento CH340) ----------
let device,epIn,epOut,ctrlIdx,reading=false,rxBuf='';
let ackResolve=null, coda=Promise.resolve();

async function connetti(){
  try{ device=await navigator.usb.requestDevice({filters:[]}); }
  catch(e){ log('Nessun dispositivo scelto.'); return; }
  try{
    await device.open();
    if(device.configuration===null) await device.selectConfiguration(1);

    if(device.vendorId===0x1a86){
      warn.style.display='block';
      warn.innerHTML='Questa UNO sembra un chip <b>CH340</b>. Questa versione dell\'app è ottimizzata per le UNO <b>CDC</b>. Se non risponde, scrivimelo in chat.';
    }
    await initCDC();
    reading=true; leggiLoop();
    stato(true);
    log('Connesso. Attendo l\'avvio del robot…');
    device.addEventListener&&navigator.usb.addEventListener('disconnect',ev=>{
      if(ev.device===device){ reading=false; stato(false); log('Robot scollegato.'); }
    });
  }catch(e){ log('Errore connessione: '+e.message); }
}

async function initCDC(){
  const intf=device.configuration.interfaces;
  let dataIntf=null, commIdx=null;
  for(const i of intf){
    const a=i.alternates[0];
    if(a.interfaceClass===10) dataIntf=i;          // CDC Data
    if(a.interfaceClass===2)  commIdx=i.interfaceNumber; // CDC Comm
  }
  if(!dataIntf){ // fallback: prima interfaccia con endpoint bulk
    for(const i of intf){
      if(i.alternates[0].endpoints.some(e=>e.type==='bulk')){ dataIntf=i; break; }
    }
  }
  if(!dataIntf) throw new Error('nessuna interfaccia dati trovata');

  if(commIdx!==null){ try{ await device.claimInterface(commIdx); }catch(e){} }
  ctrlIdx=(commIdx!==null)?commIdx:dataIntf.interfaceNumber;
  await device.claimInterface(dataIntf.interfaceNumber);

  for(const e of dataIntf.alternates[0].endpoints){
    if(e.direction==='in')  epIn=e.endpointNumber;
    if(e.direction==='out') epOut=e.endpointNumber;
  }
  // 9600 baud, 8 bit, 1 stop, no parity
  const lc=new Uint8Array([0x80,0x25,0x00,0x00,0x00,0x00,0x08]);
  try{ await device.controlTransferOut({requestType:'class',recipient:'interface',request:0x20,value:0,index:ctrlIdx},lc); }catch(e){}
  // DTR + RTS (fa anche ripartire lo sketch)
  try{ await device.controlTransferOut({requestType:'class',recipient:'interface',request:0x22,value:0x03,index:ctrlIdx}); }catch(e){}
}

async function leggiLoop(){
  while(reading){
    try{
      const r=await device.transferIn(epIn,64);
      if(r.data&&r.data.byteLength){
        rxBuf+=new TextDecoder().decode(r.data);
        let i;
        while((i=rxBuf.indexOf('\n'))>=0){
          const line=rxBuf.slice(0,i).replace(/\r/g,'');
          rxBuf=rxBuf.slice(i+1);
          if(line.length) riceviLinea(line);
        }
      }
    }catch(e){ if(reading) log('Lettura interrotta.'); break; }
  }
}
function riceviLinea(line){
  log('‹ '+line);
  if(ackResolve && /\bok\b|sconosc|errore|non trovato|pronto/i.test(line)){
    const r=ackResolve; ackResolve=null; r();
  }
}

async function inviaRaw(cmd){
  if(!device){ log('Prima premi Connetti.'); return; }
  await device.transferOut(epOut,new TextEncoder().encode(cmd+'\n'));
  log('› '+cmd);
  await new Promise(res=>{ ackResolve=res; setTimeout(()=>{if(ackResolve){ackResolve=null;res();}},2500); });
}
function invia(cmd){ coda=coda.then(()=>inviaRaw(cmd).catch(e=>log('Errore invio.'))); return coda; }

// ---------- interprete italiano (uguale per testo e voce) ----------
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();
function interpreta(fraseRaw){
  const t=norm(fraseRaw);
  const out=[];
  for(const p of t.split(/\s+e\s+|,|;/)){ const c=unComando(p.trim()); if(c) out.push(c); }
  return out;
}
function unComando(p){
  if(!p) return null;
  if(['su','giu','centro','saluta','ballo','cambia occhi','stato','diag'].includes(p)) return p;
  let m=p.match(/^(dx|sx)\s+(\d{1,3})$/); if(m) return m[1]+' '+Math.min(180,+m[2]);
  if(/^(dx|sx)\s+(su|giu|saluta)$/.test(p)) return p;
  if(/^colore\s+\w+$/.test(p)) return p;

  let side=null;
  if(/destr|\bdx\b/.test(p)) side='dx';
  else if(/sinistr|\bsx\b/.test(p)) side='sx';

  if(/occhi/.test(p)) return 'cambia occhi';
  if(/ball/.test(p)) return 'ballo';
  if(/centro|riposo|dritt|fermo/.test(p)) return 'centro';

  const colori=['rosso','verde','blu','giallo','viola','azzurro','bianco','spento'];
  const col=colori.find(c=>p.includes(c));
  if(col && (/color|spall|luc|led/.test(p) || !side)) return 'colore '+col;

  const g=p.match(/(\d{1,3})/);
  if(side&&g) return side+' '+Math.min(180,+g[1]);

  if(/salut|ciao/.test(p)) return side? side+' saluta':'saluta';
  let dir=null;
  if(/\b(su|alz|solle|sopra)/.test(p)) dir='su';
  else if(/\b(giu|abbass|scend|sotto|basso)/.test(p)) dir='giu';
  if(dir) return side? side+' '+dir : dir;
  if(side) return side+' su';
  return null;
}
function mandaFrase(f){
  const cmds=interpreta(f);
  if(!cmds.length){ log('Non ho capito un comando in: "'+f+'"'); return; }
  cmds.forEach(invia);
}

// ---------- voce ----------
let rec=null;
function parla(){
  const SR=window.webkitSpeechRecognition||window.SpeechRecognition;
  if(!SR){ log('Riconoscimento vocale non disponibile su questo browser.'); return; }
  rec=new SR(); rec.lang='it-IT'; rec.interimResults=false; rec.maxAlternatives=1;
  $('#btnMic').classList.add('live'); $('#btnMic').textContent='🎙️ Ascolto…';
  rec.onresult=e=>{ const f=e.results[0][0].transcript; log('🗣️ "'+f+'"'); mandaFrase(f); };
  rec.onerror=e=>log('Voce: '+e.error);
  rec.onend=()=>{ $('#btnMic').classList.remove('live'); $('#btnMic').textContent='🎤 Parla al robot'; };
  try{ rec.start(); }catch(e){}
}

// ---------- eventi ----------
$('#btnConn').onclick=connetti;
$('#btnMic').onclick=parla;
$('#btnSend').onclick=()=>{ const v=$('#txt').value.trim(); if(v){ mandaFrase(v); $('#txt').value=''; } };
$('#txt').addEventListener('keydown',e=>{ if(e.key==='Enter') $('#btnSend').click(); });
document.querySelectorAll('[data-cmd]').forEach(b=>b.onclick=()=>invia(b.dataset.cmd));
</script>
</body>
</html>
